1:'<span class="kp">V1 · REPRISE — NE CHARGE PAS.</span> Après 1 mois off, tes muscles se souviennent mais tendons, dos et SNC non. ~63% au squat, RIR 3-4, ça DOIT sembler facile. C\'est voulu : on évite les courbatures qui te feraient sauter la séance suivante. Méthode : TEMPO. Note tout, c\'est ta base.',

5:'<span class="kp">V2 · CONTRASTE — nouvelles méthodes.</span> Le squat passe en contraste (lourd + speed enchaînés), l\'incliné en stato 2 temps (baisse la charge ~10%), le militaire en stato. Nouvelles sensations, même exercices. Dropsets et myo-reps arrivent sur les isolations.',

{day:1,nm:'A — JAMBES QUAD',wu:'QUAD',type:'gym',dur:['~72','~72','~75','~78','~78','~80','~80','~58','~80','~80','~82','~58'],ex:[

function rI(){return '<div class="fi"><div class="ih"><h1>FORGE</h1><div class="su">12 semaines \u00b7 hypertrophie + force</div><div class="tg">SEPT \u2192 D\u00c9C \u00b7 ON CONSTRUIT</div></div>'+
'<div class="is"><h3>\u25c6 OBJECTIF</h3><p>Construire la mati\u00e8re premi\u00e8re : <b>muscle + force</b>. <b>Jambes fortes et volumineuses</b>, <b>grosses \u00e9paules</b>, mollets prioritaires, correction des <b>asym\u00e9tries</b> (jambes + dos). Explosivit\u00e9, conditioning et course maintenus. En l\u00e9ger surplus.</p></div>'+
'<div class="is"><h3>\u25c6 FORMAT</h3><p><b>4 s\u00e9ances A/B/C/D</b>, ordre libre, pas de jours fixes. Une seule r\u00e8gle : jamais A et C cons\u00e9cutives.</p><ul><li><b>A</b> \u2014 Jambes quad ~1h15</li><li><b>B</b> \u2014 Haut 1 lourd <b>~1h10</b> (inclin\u00e9, tractions lest\u00e9es, row uni)</li><li><b>C</b> \u2014 Jambes post\u00e9rieur ~1h15 + WOD</li><li><b>D</b> \u2014 Haut 2 volume <b>~1h10</b> (militaire, machines iso-lat\u00e9rales)</li><li><b>COURSE</b> \u2014 2 sorties fixes (1 Z2 + 1 vive)</li></ul><p style="margin-top:8px">Pec, dos et \u00e9paules touch\u00e9s <b>2\u00d7/semaine</b>. B et D \u2192 lundi matin ou d\u00e9placement.</p></div>'+
'<div class="is"><h3>\u25c6 3 VAGUES DE M\u00c9THODES</h3><p>Les <b>exercices moteurs ne changent pas</b> (c\'est eux qui portent ta progression). C\'est la <b>M\u00c9THODE</b> qui tourne toutes les 4 semaines \u2014 anti-lassitude + capacit\u00e9s vari\u00e9es.</p><ul><li><b>V1 (S1-S4)</b> \u2014 TEMPO + tension continue</li><li><b>V2 (S5-S8)</b> \u2014 CONTRASTE (lourd + explosif) + stato</li><li><b>V3 (S9-S12)</b> \u2014 STATO (pauses) + intensit\u00e9 max</li></ul><p style="margin-top:8px">Les <b>machines et accessoires</b> changent aussi par vague. Deload en S8 et S12.</p></div>'+
'<div class="is"><h3>\u25c6 LES 3 PREMI\u00c8RES SEMAINES</h3><p><span class="kp">NE CHARGE PAS.</span> Tu sors d\'un mois off : le muscle se souvient, mais tendons, dos et syst\u00e8me nerveux non. Squat \u00e0 ~95kg en S1 (63%), RIR 3-4. \u00c7a doit sembler facile \u2014 c\'est voulu. La vraie charge commence en S4.</p></div>'+
'<div class="is"><h3>\u25c6 BARRE vs MACHINE</h3><p><b>Barres</b> (squat, RDL, inclin\u00e9, militaire, tractions) = les moteurs de force, faits FRAIS, avec les m\u00e9thodes par vague.<br><b>Machines</b> (presses, iso-lat\u00e9rales, curls, mollets) = le volume d\'hypertrophie, o\u00f9 tu vas <b>vraiment pr\u00e8s de l\'\u00e9chec</b> sans risque, avec dropsets et myo-reps.</p></div>'+
'<div class="is"><h3>\u25c6 ASYM\u00c9TRIES \u2014 LA R\u00c8GLE</h3><p>Sur chaque exo unilat\u00e9ral : <b>c\u00f4t\u00e9 FAIBLE en premier</b>, et le c\u00f4t\u00e9 fort ne fait QUE le nombre de reps que le faible a r\u00e9ussi. C\'est la seule fa\u00e7on de rattraper l\'\u00e9cart. Les deux c\u00f4t\u00e9s se loguent s\u00e9par\u00e9ment.</p></div>'+
'<div class="is"><h3>\u25c6 APR\u00c8S</h3><p>D\u00e9cembre : bilan + bloc force court. <b>Janvier \u2192 avril : pr\u00e9pa HYROX</b>. <b>12 avril 2027 : HYROX Paris</b>, objectif 1h10-1h15. Le muscle et la force construits ici seront ton avantage sur les stations.</p></div>'+
'<button class="sb" onclick="nav(\'weeks\')">PROGRAMME \u2192</button>'+
'<button class="sb alt" onclick="nav(\'goals\')">OBJECTIFS & VOLUME \u2192</button></div>'}

function exportSession(w,d){var D=DAYS.find(function(x){return x.day===d});if(!D)return;var dt=new Date();var dateStr=dt.toLocaleDateString('fr-FR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

var totalS=0,doneS=0;
D.ex.forEach(function(ex,ei){var wk=ex.weeks[w];if(!wk||wk.rx==='—')return;
r+='▸ '+ex.n+(ex.tag==='pillar'?' ⭐':'')+'\n';

 if(ex.parts){
  ex.parts.forEach(function(pn,pi){
   r+='  ▸ '+pn+'\n';var charges=[],reps=[];
   for(var si=0;si<ns;si++){var ck=gL(w,d,ei,si,'kg'+pi),cr=gL(w,d,ei,si,'rp'+pi);totalS++;if(ck||cr){doneS++;r+='    S'+(si+1)+': '+(cr?cr+'r':'?')+' × '+(ck?ck+'kg':'?')+'\n';if(ck)charges.push(parseFloat(ck));if(cr)reps.push(parseInt(cr))}else{r+='    S'+(si+1)+': ⬜\n'}}
   if(charges.length){var avg=(charges.reduce(function(a,b){return a+b},0)/charges.length).toFixed(1);r+='    Moy : '+avg+'kg';if(reps.length)r+=' · Reps '+reps.join('-');r+='\n'}
  });
